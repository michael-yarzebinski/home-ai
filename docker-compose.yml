services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-home-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Check against 'postgres' db instead of '${DB_NAME}' to avoid FATAL errors during init
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - home-ai-network

  ollama:
    image: ollama/ollama:latest
    container_name: home-ai-ollama
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: /bin/sh
    command: >
      -c "
        apt-get update -qq && apt-get install -y -qq curl > /dev/null 2>&1;
        ollama serve & 
        SERVER_PID=\$$!;
        echo '[OLLAMA-INIT] ⏳ Waiting for server to boot...';
        while ! curl -s http://localhost:11434/api/tags > /dev/null 2>&1; do
          sleep 2;
        done;
        echo '[OLLAMA-INIT] ✅ Server is UP. Starting model downloads...';
        
        echo '[OLLAMA-INIT] 📥 Pulling Qwen 2.5 (7B)...';
        ollama pull qwen2.5:7b;
        
        echo '[OLLAMA-INIT] 📥 Pulling Granite 3.1 (8B)...';
        ollama pull granite3.1;
        
        echo '[OLLAMA-INIT] 📥 Pulling Nomic Embed Text...';
        ollama pull nomic-embed-text;
        
        echo '[OLLAMA-INIT] 🎉 ALL MODELS INSTALLED SUCCESSFULLY';
        wait \$$SERVER_PID
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - home-ai-network

  home-ai:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    container_name: home-ai-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./attachments:/app/attachments
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - home-ai-network

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    volumes:
      - ./homeassistant:/config
    ports:
      - "8123:8123"
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - home-ai-network

networks:
  home-ai-network:
    driver: bridge

volumes:
  postgres-data:
  ollama-data: